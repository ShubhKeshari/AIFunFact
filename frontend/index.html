<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fun Facts API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Fun Facts Generator</h1>
        <p class="subtitle">Discover interesting facts powered by AI</p>
        
        <div class="button-container">
            <button id="funFactBtn">Get a Fun Fact</button>
        </div>
        
        <div class="loading" id="loading">
            <span class="spinner"></span> Generating fun fact...
        </div>
        
        <div class="fact-box" id="factBox">
            <div class="fact-text" id="factText"></div>
            <div class="fact-time" id="factTime"></div>
        </div>
        
        <div class="fact-box error" id="errorBox"></div>
        
        <div class="info">
            <strong>How it works:</strong> Click the button to generate a unique fun fact using AI. Each fact is generated in real-time!
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
